{% extends "base.html" %}
{% block title %}写邮件{% endblock %}
{% block content %}
<h2>撰写新邮件</h2>
<form method="POST" action="/send_email">
    <div class="mb-3">
        <label class="form-label">主题</label>
        <input type="text" class="form-control" name="title" required>
    </div>
    <div class="mb-3">
        <label class="form-label">收件人</label>
        <select class="form-select" name="recipients" multiple required>
            {% for contact in contacts %}
            <option value="{{ contact.uid }}">{{ contact.uname }} ({{ contact.email }})</option>
            {% endfor %}
        </select>
        <small class="form-text text-muted">按住Ctrl可选择多个收件人</small>
    </div>
    <div class="mb-3">
        <label class="form-label">抄送人</label>
        <select class="form-select" name="cc_list" multiple>
            {% for contact in contacts %}
            <option value="{{ contact.uid }}">{{ contact.uname }} ({{ contact.email }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">邮件内容</label>
        <textarea class="form-control" name="content" rows="8" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">发送邮件</button>
    <a href="/emails" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
