<!DOCTYPE html>
<html>
<head>
    <title>邮件管理系统 - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">邮件管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    {% if 'user_id' in session %}
                    <li class="nav-item"><a class="nav-link" href="/dashboard">仪表盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contacts">联系人</a></li>
                    <li class="nav-item"><a class="nav-link" href="/emails">邮件</a></li>
                    <li class="nav-item"><a class="nav-link" href="/compose">写邮件</a></li>
                    {% endif %}
                </ul>
                <ul class="navbar-nav">
                    {% if 'user_id' in session %}
                    <li class="nav-item"><span class="navbar-text">欢迎, {{ session['user_name'] }}</span></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">退出</a></li>
                    {% else %}
                    <li class="nav-item"><a class="nav-link" href="/">登录</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
